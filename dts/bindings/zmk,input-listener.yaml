description: |
  Listener to subscribe to input events and send HID updates after processing

compatible: "zmk,input-listener-ps2"

properties:
  device:
    type: phandle
    required: true
  xy-swap:
    type: boolean
  x-invert:
    type: boolean
  y-invert:
    type: boolean
  scale-multiplier:
    type: int
    default: 1
  scale-divisor:
    type: int
    default: 1
  layer-toggle:
    type: int
    default: -1
    required: false
    description: The layer that should be toggled when the mouse is moved.
  layer-toggle-delay-ms:
    type: int
    default: 250
    required: false
    description: How many miliseconds of mouse activity are required before the layer is toggled on.
  layer-toggle-timeout-ms:
    type: int
    default: 250
    required: false
    description: How many miliseconds of mouse inactivity are required before the layer is toggled off again.
  scroll-layer:
    type: int
    default: -1
    required: false
    description: The layer index that activates scroll mode when it is the highest active layer.
  scroll-speed-num:
    type: int
    default: 1
    required: false
    description: Numerator for scroll speed scaling factor (e.g., 1 for 1/10 speed, 2 for 2/10=1/5 speed)
  scroll-speed-den:
    type: int
    default: 2
    required: false
    description: Denominator for scroll speed scaling factor (e.g., 10 for 1/10 speed, 20 for 1/20 speed)
  idle-sleep-threshold-ms:
    type: int
    default: 1000
    required: false
    description: idle sleep
